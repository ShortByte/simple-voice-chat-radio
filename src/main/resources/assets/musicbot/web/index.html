<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MusicBot Panel</title>
<style>
  :root {
    --bg: #12131a; --panel: #1b1d27; --panel2: #232634; --border: #2e3244;
    --text: #e6e8f0; --muted: #8b90a5; --accent: #f5a524; --accent2: #ffcf70;
    --danger: #ef5b5b; --ok: #46c37b; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header .bot { color: var(--muted); }
  header .spacer { flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--danger); }
  main { max-width: 1200px; margin: 0 auto; padding: 18px 16px 40px; display: grid; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-width: 0; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card h2 .count { color: var(--text); background: var(--panel2); border-radius: 99px; padding: 0 8px; font-size: 12px; }
  .card h2 .right { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }

  .now-title { font-size: 19px; font-weight: 650; margin: 0 0 2px; overflow-wrap: anywhere; }
  .now-sub { color: var(--muted); margin-bottom: 12px; min-height: 1.45em; }
  .progress { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .bar { flex: 1; height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; cursor: pointer; }
  .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .4s linear; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .vol { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--muted); }
  .vol input { width: 140px; accent-color: var(--accent); }

  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1a1406; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: var(--accent2); }
  button.on { border-color: var(--accent); color: var(--accent2); }
  button.icon { padding: 3px 8px; font-size: 13px; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  input[type=text], input[type=password], input[type=search] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit; min-width: 0; }
  input:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row input { flex: 1 1 260px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }

  ol.list { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
  ol.list li { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  ol.list li:last-child { border-bottom: 0; }
  ol.list .nr { color: var(--muted); width: 2.6em; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
  ol.list .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol.list .d { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; font-size: 12px; }
  ol.list .acts { display: flex; gap: 4px; flex: none; }
  .empty { color: var(--muted); padding: 10px 4px; }

  #log { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; height: 220px; overflow-y: auto; padding: 8px 10px; font: 12.5px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  #log .time { color: var(--muted); }
  #log .cmd { color: var(--accent2); }

  #login { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 16px; }
  #login form { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 360px; display: grid; gap: 12px; }
  #login h1 { margin: 0; font-size: 18px; }
  #login .err { color: var(--danger); min-height: 1.4em; font-size: 13px; }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>MusicBot Panel</h1>
    <div class="hint" style="margin:0">The password is in <code>config/musicbot.json</code> (<code>webPanelPassword</code>), or run <code>/musicbot web</code> on the bot.</div>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" type="submit">Log in</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<header>
  <span class="dot" id="dot"></span>
  <h1>MusicBot</h1>
  <span class="bot" id="botName"></span>
  <span class="spacer"></span>
  <button class="icon" id="logout" title="Log out">Log out</button>
</header>

<main>
  <section class="card">
    <h2>Now playing <span class="right" id="status"></span></h2>
    <div class="now-title" id="nowTitle">Nothing</div>
    <div class="now-sub" id="nowSub"></div>
    <div class="progress">
      <span id="pos">0:00</span>
      <div class="bar" id="bar" title="Click to seek"><div id="barFill"></div></div>
      <span id="dur">0:00</span>
    </div>
    <div class="controls">
      <button class="primary" id="btnPause">⏸ Pause</button>
      <button data-cmd="skip">⏭ Skip</button>
      <button data-cmd="stop" class="danger">⏹ Stop</button>
      <button data-cmd="shuffle">🔀 Shuffle</button>
      <button id="btnRepeat">🔁 Repeat: off</button>
      <button id="btnBob">🎧 Head bob</button>
      <div class="vol">🔊 <input type="range" id="vol" min="0" max="200" step="5"> <span id="volVal">0%</span></div>
    </div>
  </section>

  <section class="card">
    <h2>Add</h2>
    <form class="row" id="addForm">
      <input type="text" id="query" placeholder="YouTube/SoundCloud link or search term (sc: for SoundCloud)" autocomplete="off">
      <button class="primary" type="submit" data-mode="play">▶ Play</button>
      <button type="button" data-mode="playnext">⤴ Up next</button>
      <button type="button" data-mode="playnow">⚡ Play now</button>
      <button type="button" data-mode="download">⬇ Save</button>
    </form>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>Queue <span class="count" id="queueCount">0</span>
        <span class="right"><button class="icon danger" data-cmd="clear">Clear</button></span></h2>
      <ol class="list" id="queue"></ol>
    </section>
    <section class="card">
      <h2>Library <span class="count" id="libCount">0</span>
        <span class="right row" style="flex-wrap:nowrap">
          <input type="search" id="libFilter" placeholder="Search" style="width:150px;padding:4px 8px">
          <button class="icon" id="libAll" title="Add all (filtered) tracks to the queue">All ▶</button>
        </span></h2>
      <ol class="list" id="library"></ol>
    </section>
  </div>

  <section class="card">
    <h2>Log</h2>
    <div id="log"></div>
    <form class="row" id="cmdForm" style="margin-top:10px">
      <input type="text" id="cmd" placeholder="Any command, e.g. join Party, member add Name, seek 1:30" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'musicbot.password';
  let password = null;
  try { password = localStorage.getItem(KEY); } catch (e) {}
  let lastLog = 0;
  let state = null;
  let volumeDragging = false;
  let pollTimer = null;

  const fmt = s => {
    if (s == null || s < 0) return 'LIVE';
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
  };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function showLogin(msg) {
    $('login').style.display = 'flex';
    $('loginErr').textContent = msg || '';
    clearTimeout(pollTimer);
    $('pw').focus();
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), 'Authorization': 'Bearer ' + password, 'Content-Type': 'application/json' } });
    if (res.status === 401) { password = null; try { localStorage.removeItem(KEY); } catch (e) {} showLogin('Wrong password'); throw new Error('unauthorized'); }
    return res.json();
  }

  async function send(command) {
    if (!command) return;
    try { await api('/api/command', { method: 'POST', body: JSON.stringify({ command }) }); } catch (e) { return; }
    setTimeout(poll, 250);
  }

  async function poll() {
    clearTimeout(pollTimer);
    if (!password) return showLogin();
    try {
      const s = await api('/api/state?since=' + lastLog);
      $('login').style.display = 'none';
      render(s);
      $('dot').className = 'dot ' + (s.ready ? 'ok' : 'bad');
    } catch (e) {
      if (e.message === 'unauthorized') return;
      $('dot').className = 'dot bad';
      $('status').textContent = 'No connection to the bot';
    }
    pollTimer = setTimeout(poll, 1000);
  }

  function render(s) {
    state = s;
    $('botName').textContent = s.bot;
    $('status').textContent = s.ready ? '' : s.status;
    const c = s.current;
    if (c) {
      $('nowTitle').textContent = c.title;
      const sub = $('nowSub'); sub.textContent = '';
      sub.append((s.paused ? '⏸ paused · ' : '') + 'requested by ' + c.requestedBy + (c.local ? ' · from library' : ''));
      if (c.url) { sub.append(' · '); const a = el('a', null, 'Link'); a.href = c.url; a.target = '_blank'; a.rel = 'noopener'; sub.append(a); }
      $('pos').textContent = fmt(c.position);
      $('dur').textContent = fmt(c.duration);
      $('barFill').style.width = c.duration > 0 ? Math.min(100, c.position / c.duration * 100) + '%' : '100%';
    } else {
      $('nowTitle').textContent = 'Nothing';
      $('nowSub').textContent = s.queueSize ? '' : 'The queue is empty – add something below.';
      $('pos').textContent = $('dur').textContent = '0:00';
      $('barFill').style.width = '0';
    }
    $('btnPause').textContent = s.paused ? '▶ Resume' : '⏸ Pause';
    $('btnRepeat').textContent = '🔁 Repeat: ' + ({ OFF: 'off', ONE: 'track', ALL: 'queue' })[s.repeat];
    $('btnRepeat').classList.toggle('on', s.repeat !== 'OFF');
    $('btnBob').classList.toggle('on', s.headBob);
    if (!volumeDragging) { $('vol').value = s.volume; $('volVal').textContent = s.volume + '%'; }

    // queue
    $('queueCount').textContent = s.queueSize;
    const q = $('queue'); q.textContent = '';
    if (!s.queue.length) q.append(el('li', 'empty', 'Empty'));
    s.queue.forEach((t, i) => {
      const li = el('li');
      li.append(el('span', 'nr', i + 1 + '.'), el('span', 't', t.title), el('span', 'd', fmt(t.duration)));
      const acts = el('span', 'acts');
      if (i > 0) acts.append(button('⤒', 'Move to top', () => send(`move ${i + 1} 1`)));
      acts.append(button('✕', 'Remove', () => send(`remove ${i + 1}`), 'danger'));
      li.append(acts);
      li.querySelector('.t').title = t.title + ' · requested by ' + t.requestedBy;
      q.append(li);
    });

    renderLibrary();

    // log
    const log = $('log');
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 30;
    for (const line of s.log) {
      lastLog = Math.max(lastLog, line.id);
      const div = el('div');
      const t = new Date(line.time).toLocaleTimeString();
      div.append(el('span', 'time', t + ' '), el('span', line.text.startsWith('> ') ? 'cmd' : null, line.text));
      log.append(div);
    }
    while (log.childElementCount > 300) log.firstElementChild.remove();
    if (atBottom && s.log.length) log.scrollTop = log.scrollHeight;
  }

  function filteredLibrary() {
    if (!state) return [];
    const words = $('libFilter').value.toLowerCase().split(/\s+/).filter(Boolean);
    return state.library.filter(e => words.every(w => e.title.toLowerCase().includes(w)));
  }

  function renderLibrary() {
    if (!state) return;
    $('libCount').textContent = state.library.length;
    const list = $('library'); list.textContent = '';
    const items = filteredLibrary();
    if (!items.length) list.append(el('li', 'empty', state.library.length ? 'No results' : 'Nothing saved yet – use “⬇ Save”.'));
    items.slice(0, 500).forEach(e => {
      const li = el('li');
      li.append(el('span', 'nr', '#' + e.nr), el('span', 't', e.title), el('span', 'd', fmt(e.duration)));
      const acts = el('span', 'acts');
      acts.append(button('▶', 'Add to queue', () => send('playlib ' + e.nr)));
      acts.append(button('🗑', 'Delete', () => { if (confirm(`Delete “${e.title}” from the library?`)) send('libremove ' + e.nr); }, 'danger'));
      li.append(acts);
      list.append(li);
    });
  }

  function button(text, title, onClick, cls) {
    const b = el('button', 'icon' + (cls ? ' ' + cls : ''), text);
    b.title = title; b.type = 'button'; b.onclick = onClick;
    return b;
  }

  // ---- events
  $('loginForm').onsubmit = e => {
    e.preventDefault();
    password = $('pw').value.trim();
    try { localStorage.setItem(KEY, password); } catch (err) {}
    $('loginErr').textContent = '';
    lastLog = 0; $('log').textContent = '';
    poll();
  };
  $('logout').onclick = () => { password = null; try { localStorage.removeItem(KEY); } catch (e) {} showLogin(); };

  document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => send(b.dataset.cmd));
  $('btnPause').onclick = () => send(state && state.paused ? 'resume' : 'pause');
  $('btnRepeat').onclick = () => send('repeat');
  $('btnBob').onclick = () => send('bob');

  const vol = $('vol');
  vol.oninput = () => { volumeDragging = true; $('volVal').textContent = vol.value + '%'; };
  vol.onchange = () => { send('volume ' + vol.value); setTimeout(() => volumeDragging = false, 1200); };

  $('bar').onclick = e => {
    const c = state && state.current;
    if (!c || !(c.duration > 0)) return;
    const r = e.currentTarget.getBoundingClientRect();
    send('seek ' + Math.floor((e.clientX - r.left) / r.width * c.duration));
  };

  const addForm = $('addForm');
  const submitAdd = mode => {
    const q = $('query').value.trim();
    if (!q && mode !== 'download') return $('query').focus();
    send((mode + ' ' + q).trim());
    $('query').value = '';
  };
  addForm.onsubmit = e => { e.preventDefault(); submitAdd('play'); };
  addForm.querySelectorAll('button[type=button]').forEach(b => b.onclick = () => submitAdd(b.dataset.mode));

  $('libFilter').oninput = renderLibrary;
  $('libAll').onclick = () => {
    const items = filteredLibrary();
    if (!items.length) return;
    if (items.length === state.library.length) return send('playlib all');
    send('playlib ' + items.map(e => e.nr).join(' '));
  };

  $('cmdForm').onsubmit = e => { e.preventDefault(); send($('cmd').value.trim()); $('cmd').value = ''; };

  poll();
})();
</script>
</body>
</html>
