# Creates a draft release with the jars of every Minecraft version when a tag like v1.0.0 is pushed.
# Review the draft on GitHub and click "Publish release".
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the mod version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 == "## " v {found=1; next} /^## / && found {exit} found' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section '## $VERSION' in CHANGELOG.md"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test all Minecraft versions
        run: ./gradlew buildAll test

      - uses: softprops/action-gh-release@v2
        with:
          name: Voice Chat Music Bot ${{ env.VERSION }}
          body_path: release-notes.md
          draft: true
          files: build/libs/*.jar
          fail_on_unmatched_files: true
