name: Build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test all Minecraft versions
        run: ./gradlew buildAll test

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/*.jar
